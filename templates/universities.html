{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mb-4 bg-white">
    <h3 class="fw-bold mb-3">Додати університет</h3>
    <form method="POST" class="row g-3">
        <div class="col-md-10"><input type="text" name="name" class="form-control" placeholder="Назва університету" required></div>
        <div class="col-md-2"><button class="btn btn-success w-100">Зберегти</button></div>
    </form>
</div>
<div class="card p-4 bg-white">
    <h3 class="fw-bold mb-3">University</h3>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>Назва</th><th class="actions">Дії</th></tr></thead>
            <tbody>
                {% for u in universities %}
                <tr>
                    <form method="POST" action="{{ url_for('update_university') }}">
                        <input type="hidden" name="old_name" value="{{ u.name }}">
                        <td><input name="name" class="form-control" value="{{ u.name }}" required></td>
                        <td><button class="btn btn-primary btn-sm">Редагувати</button></td>
                    </form>
                    <td>
                        <form method="POST" action="{{ url_for('delete_university') }}" onsubmit="return confirm('Видалити запис?')">
                            <input type="hidden" name="name" value="{{ u.name }}">
                            <button class="btn btn-danger btn-sm">Видалити</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
