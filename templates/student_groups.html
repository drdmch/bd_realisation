{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mb-4 bg-white">
    <h3 class="fw-bold mb-3">Додати студентську групу</h3>
    <form method="POST" class="row g-3">
        <div class="col-md-3"><input name="name" class="form-control" placeholder="Назва групи" required></div>
        <div class="col-md-2"><input name="enrollment_year" type="number" class="form-control" placeholder="Рік набору" required></div>
        <div class="col-md-2"><input name="course" type="number" class="form-control" placeholder="Курс" required></div>
        <div class="col-md-3"><select name="dept_name" class="form-select" required>{% for d in departments %}<option value="{{ d.name }}">{{ d.name }}</option>{% endfor %}</select></div>
        <div class="col-md-2"><button class="btn btn-success w-100">Зберегти</button></div>
    </form>
</div>
<div class="card p-4 bg-white">
    <h3 class="fw-bold mb-3">StudentGroup</h3>
    <div class="table-responsive"><table class="table table-hover align-middle">
        <thead><tr><th>Група</th><th>Рік набору</th><th>Курс</th><th>Кафедра</th><th colspan="2">Дії</th></tr></thead>
        <tbody>{% for g in groups %}<tr>
            <form method="POST" action="{{ url_for('update_student_group') }}">
                <input type="hidden" name="old_name" value="{{ g.name }}">
                <td><input name="name" class="form-control" value="{{ g.name }}" required></td>
                <td><input name="enrollment_year" type="number" class="form-control" value="{{ g.enrollmentyear }}" required></td>
                <td><input name="course" type="number" class="form-control" value="{{ g.course }}" required></td>
                <td><select name="dept_name" class="form-select" required>{% for d in departments %}<option value="{{ d.name }}" {% if d.name == g.deptname %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></td>
                <td><button class="btn btn-primary btn-sm">Редагувати</button></td>
            </form>
            <td><form method="POST" action="{{ url_for('delete_student_group') }}" onsubmit="return confirm('Видалити запис?')"><input type="hidden" name="name" value="{{ g.name }}"><button class="btn btn-danger btn-sm">Видалити</button></form></td>
        </tr>{% endfor %}</tbody>
    </table></div>
</div>
{% endblock %}
