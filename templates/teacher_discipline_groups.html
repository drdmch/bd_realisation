{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mb-4 bg-white">
    <h3 class="fw-bold mb-3">Призначити викладача на дисципліну для групи</h3>
    <form method="POST" class="row g-3">
        <div class="col-md-4"><label class="form-label small text-muted">Викладач</label><select name="teacher_id" class="form-select" required>{% for t in teachers %}<option value="{{ t.passportid }}">{{ t.fullname }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label small text-muted">Дисципліна</label><select name="discipline_key" class="form-select" required>{% for d in disciplines %}<option value="{{ d.deptname }}|{{ d.name }}">{{ d.deptname }} — {{ d.name }}</option>{% endfor %}</select></div>
        <div class="col-md-3"><label class="form-label small text-muted">Група</label><select name="group_name" class="form-select" required>{% for g in groups %}<option value="{{ g.name }}">{{ g.name }}</option>{% endfor %}</select></div>
        <div class="col-md-1 d-flex align-items-end"><button class="btn btn-success w-100">OK</button></div>
    </form>
</div>
<div class="card p-4 bg-white">
    <h3 class="fw-bold mb-3">Teacher_Discipline_Group</h3>
    <div class="table-responsive"><table class="table table-hover align-middle">
        <thead><tr><th>Викладач</th><th>Дисципліна</th><th>Група</th><th colspan="2">Дії</th></tr></thead>
        <tbody>{% for a in assignments %}<tr>
            <form method="POST" action="{{ url_for('update_teacher_discipline_group') }}">
                <input type="hidden" name="old_teacher_id" value="{{ a.teacherid }}">
                <input type="hidden" name="old_dept_name" value="{{ a.deptname }}">
                <input type="hidden" name="old_disc_name" value="{{ a.discname }}">
                <input type="hidden" name="old_group_name" value="{{ a.groupname }}">
                <td><select name="teacher_id" class="form-select" required>{% for t in teachers %}<option value="{{ t.passportid }}" {% if t.passportid == a.teacherid %}selected{% endif %}>{{ t.fullname }}</option>{% endfor %}</select></td>
                <td><select name="discipline_key" class="form-select" required>{% for d in disciplines %}<option value="{{ d.deptname }}|{{ d.name }}" {% if d.deptname == a.deptname and d.name == a.discname %}selected{% endif %}>{{ d.deptname }} — {{ d.name }}</option>{% endfor %}</select></td>
                <td><select name="group_name" class="form-select" required>{% for g in groups %}<option value="{{ g.name }}" {% if g.name == a.groupname %}selected{% endif %}>{{ g.name }}</option>{% endfor %}</select></td>
                <td><button class="btn btn-primary btn-sm">Редагувати</button></td>
            </form>
            <td><form method="POST" action="{{ url_for('delete_teacher_discipline_group') }}" onsubmit="return confirm('Видалити запис?')"><input type="hidden" name="teacher_id" value="{{ a.teacherid }}"><input type="hidden" name="dept_name" value="{{ a.deptname }}"><input type="hidden" name="disc_name" value="{{ a.discname }}"><input type="hidden" name="group_name" value="{{ a.groupname }}"><button class="btn btn-danger btn-sm">Видалити</button></form></td>
        </tr>{% endfor %}</tbody>
    </table></div>
</div>
{% endblock %}
