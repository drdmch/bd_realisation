{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mb-4 bg-white">
    <h3 class="fw-bold mb-3 text-dark">Додати нового студента</h3>
    <form method="POST" class="row g-3">
        <div class="col-md-4"><label class="form-label small fw-semibold text-muted">Обрати людину</label><select name="passport_id" class="form-select" required>{% for p in persons %}<option value="{{ p.passportid }}">{{ p.fullname }} ({{ p.passportid }})</option>{% endfor %}</select></div>
        <div class="col-md-2"><label class="form-label small fw-semibold text-muted">№ Заліковки</label><input type="text" name="record_book" class="form-control" required></div>
        <div class="col-md-2"><label class="form-label small fw-semibold text-muted">Рік вступу</label><input type="number" name="year" class="form-control" value="2024" required></div>
        <div class="col-md-2"><label class="form-label small fw-semibold text-muted">Форма навчання</label><select name="study_form" class="form-select"><option value="Денна">Денна</option><option value="Заочна">Заочна</option></select></div>
        <div class="col-md-2"><label class="form-label small fw-semibold text-muted">Група</label><select name="group_name" class="form-select" required>{% for g in groups %}<option value="{{ g.name }}">{{ g.name }}</option>{% endfor %}</select></div>
        <div class="col-12 text-end mt-4"><button type="submit" class="btn btn-success btn-custom px-4 shadow-sm">Зберегти</button></div>
    </form>
</div>
<div class="card p-4 bg-white">
    <h3 class="fw-bold mb-3 text-dark">Student</h3>
    <div class="table-responsive"><table class="table table-hover align-middle mt-2">
        <thead class="table-light"><tr><th>Особа</th><th>Заліковка</th><th>Рік</th><th>Форма</th><th>Група</th><th colspan="2">Дії</th></tr></thead>
        <tbody>{% for s in students %}<tr>
            <form method="POST" action="{{ url_for('update_student') }}">
                <input type="hidden" name="old_passport_id" value="{{ s.passportid }}">
                <td><select name="passport_id" class="form-select" required>{% for p in persons %}<option value="{{ p.passportid }}" {% if p.passportid == s.passportid %}selected{% endif %}>{{ p.fullname }}</option>{% endfor %}</select></td>
                <td><input name="record_book" class="form-control" value="{{ s.recordbookid }}" required></td>
                <td><input name="year" type="number" class="form-control" value="{{ s.admissionyear }}" required></td>
                <td><select name="study_form" class="form-select"><option value="Денна" {% if s.studyform == 'Денна' %}selected{% endif %}>Денна</option><option value="Заочна" {% if s.studyform == 'Заочна' %}selected{% endif %}>Заочна</option></select></td>
                <td><select name="group_name" class="form-select" required>{% for g in groups %}<option value="{{ g.name }}" {% if g.name == s.groupname %}selected{% endif %}>{{ g.name }}</option>{% endfor %}</select></td>
                <td><button class="btn btn-primary btn-sm">Редагувати</button></td>
            </form>
            <td><form method="POST" action="{{ url_for('delete_student') }}" onsubmit="return confirm('Видалити запис?')"><input type="hidden" name="passport_id" value="{{ s.passportid }}"><button class="btn btn-danger btn-sm">Видалити</button></form></td>
        </tr>{% endfor %}</tbody>
    </table></div>
</div>
{% endblock %}
